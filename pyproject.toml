[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "postern"
version = "0.17.0"
description = "A self-hosted staff reading room"
license = {text = "MIT OR Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.128,<1", "uvicorn>=0.39,<1", "pillow>=11.3,<13", "pillow-heif>=1.3,<2", "opencv-python-headless>=4.13,<5", "python-multipart>=0.0.20", "google-auth>=2.40,<3", "google-auth-oauthlib>=1.2,<2", "google-api-python-client>=2.180,<3", "requests>=2.32,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools.packages.find]
include = ["postern*"]

[tool.setuptools.package-data]
postern = ["sample_training/*.json", "sample_training/*.md", "sample_training/captions/*.md", "models/*.onnx", "models/*.txt", "models/*.md"]
