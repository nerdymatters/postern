name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # macOS, because the converter runs under sandbox-exec and the audit writer uses fullfsync.
    name: ${{ matrix.progress-backend == 'python' && 'pytest' || 'pytest-rust' }}
    runs-on: macos-15
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        progress-backend: [python, rust]
    env:
      POSTERN_PROGRESS_BACKEND: ${{ matrix.progress-backend }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install native tools
        run: |
          brew install poppler ffmpeg caddy postgresql@17
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
      - name: Install Postern
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,postgres]" psutil
      - name: Record the toolchain the converter depends on
        run: |
          python -c "import PIL, pillow_heif; print('pillow', PIL.__version__, 'pillow-heif', pillow_heif.__version__)"
          pdftoppm -v 2>&1 | head -1
      - name: Build and check the optional Rust reducer
        if: matrix.progress-backend == 'rust'
        working-directory: native/progress
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy,rustfmt
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python -m pip wheel --no-deps . --wheel-dir "$RUNNER_TEMP/native-wheels"
          python -m pip install --no-deps "$RUNNER_TEMP"/native-wheels/*.whl
      - name: Run the test suite
        run: python -m pytest tests -q
      - name: Retain the tested macOS native wheel
        if: matrix.progress-backend == 'rust'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: progress-native-macos-arm64
          path: ${{ runner.temp }}/native-wheels/*.whl
          if-no-files-found: error
          retention-days: 14

  rust-progress-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and test the portable reducer
        env:
          CARGO_BUILD_JOBS: '2'
        run: |
          rustup toolchain install 1.98.1 --profile minimal
          python -m pip install ".[test]"
          python -m pip install --no-deps ./native/progress
          python -m pytest tests/native -q

  spa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Install and check
        working-directory: dashboard/web
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test

  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Check the status worker
        working-directory: status
        run: |
          bun install --frozen-lockfile
          bun test
          bun x wrangler deploy --dry-run
