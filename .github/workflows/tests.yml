name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    # macOS, because the converter runs under sandbox-exec and the audit writer uses fullfsync.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Install native tools
        run: |
          brew install poppler ffmpeg caddy postgresql@17
          echo "$(brew --prefix postgresql@17)/bin" >> "$GITHUB_PATH"
      - name: Install Postern
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,postgres]" psutil
      - name: Record the toolchain the converter depends on
        run: |
          python -c "import PIL, pillow_heif; print('pillow', PIL.__version__, 'pillow-heif', pillow_heif.__version__)"
          pdftoppm -v 2>&1 | head -1
      - name: Run the test suite
        run: python -m pytest tests -q

  spa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - name: Install and check
        working-directory: dashboard/web
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test

  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '24'
      - name: Check the status worker
        working-directory: status
        run: |
          bun install --frozen-lockfile
          bun test
          bun x wrangler deploy --dry-run
