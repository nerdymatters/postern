name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    # macOS, because the converter runs under sandbox-exec and the audit writer uses fullfsync.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install native tools
        run: brew install poppler ffmpeg caddy
      - name: Install Postern
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]" psutil
      - name: Record the toolchain the converter depends on
        run: |
          python -c "import PIL, pillow_heif; print('pillow', PIL.__version__, 'pillow-heif', pillow_heif.__version__)"
          pdftoppm -v 2>&1 | head -1
      - name: Run the test suite
        run: python -m pytest tests -q

  spa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - name: Install and check
        working-directory: dashboard/web
        run: |
          bun install --frozen-lockfile
          bun run build
          bun run test

  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Check the status worker
        working-directory: status
        run: |
          bun install --frozen-lockfile
          bun test
          bun x wrangler deploy --dry-run
