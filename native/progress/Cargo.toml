[package]
name = "postern-progress-native"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "postern_progress_native"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "=0.30.1", features = ["abi3-py311"] }
serde_json = { version = "=1.0.154", features = ["float_roundtrip"] }

[profile.release]
codegen-units = 1
lto = "thin"
